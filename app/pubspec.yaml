name: ghar
description: "Ghar - Smart Visitor Notification System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Push Notifications
  onesignal_flutter: ^5.2.7
  flutter_local_notifications: ^18.0.1

  # Device Features
  vibration: ^2.0.0
  audioplayers: ^6.1.0

  # QR Code
  qr_flutter: ^4.1.0

  # Auth
  google_sign_in: ^6.2.2

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.4

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  pinput: ^5.0.1

  # Utils
  intl: ^0.20.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
