# Render Blueprint – https://render.com/docs/blueprint-spec
# Deploy with: https://render.com/deploy?repo=https://github.com/jellybeansenjoyer/Ghar

services:
  - type: web
    name: ghar-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free                    # free tier (spins down after 15 min idle)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_URL
        value: "https://ghar-server.onrender.com"
      - key: DATABASE_URL
        sync: false               # your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true       # auto-generate a secure random string
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false               # your Google OAuth Web Client ID
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
